name: Build and Sync to fortune-blog-backlinks

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build

      # dist/ 내용을 fortune-blog-backlinks repo에 push
      - name: Sync dist to fortune-blog-backlinks
        run: |
          cd dist

          # Git 설정
          git config --global user.email "sam1111894@users.noreply.github.com"
          git config --global user.name "Auto Deploy"

          # fortune-blog-backlinks repo 클론 (PAT 사용)
          git clone https://x-access-token:${{ secrets.GITHUB_PAT }}@github.com/sam1111894/fortune-blog-backlinks.git target

          # 기존 파일 모두 삭제 (백링크 도메인 4개의 index.html, 가이드 글들은 유지됨)
          # 우리는 fortune-blog-backlinks repo를 lucksajueun.com 본 사이트로 사용 중
          # 그래서 target의 기존 백링크 파일들 보존 + 우리 dist 파일로 덮어쓰기

          # 우선 dist의 모든 파일을 target에 복사
          cp -r dist/. target/

          # fortune-blog-backlinks repo의 CNAME 파일 보존 (있으면)
          # (없으면 무시)

          cd target
          git add -A
          if git diff --cached --quiet; then
            echo "변경 사항 없음"
            exit 0
          fi
          git commit -m "Auto deploy from fortune-adsense: $(date)"
          git push origin main
          echo "✅ Deploy 완료"
